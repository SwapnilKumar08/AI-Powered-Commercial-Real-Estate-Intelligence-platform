services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: landmark
      POSTGRES_USER: landmark
      POSTGRES_PASSWORD: landmark
    ports:
      - "5432:5432"
    volumes:
      - landmark-postgres:/var/lib/postgresql/data

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/replace-me
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - landmark-neo4j:/data

  services:
    build:
      context: .
      dockerfile: services/Dockerfile
    env_file: .env
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - neo4j

volumes:
  landmark-postgres:
  landmark-neo4j:

